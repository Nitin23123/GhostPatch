[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostpatch"
version = "0.6.0"
description = "Your bugs, fixed while you sleep. An open-source AI software engineer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nitin23123" }]
keywords = ["ai", "agent", "llm", "bug-fixing", "developer-tools", "code-graph", "groq", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/Nitin23123/GhostPatch"
Changelog = "https://github.com/Nitin23123/GhostPatch/blob/main/CHANGELOG.md"
Issues = "https://github.com/Nitin23123/GhostPatch/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ghostpatch = "ghostpatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostpatch"]

[tool.hatch.build.targets.sdist]
# Never ship local run data (graph databases, saved runs, repo memory) or the README screenshots.
exclude = ["**/.ghostpatch", "docs/*.png", "design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
