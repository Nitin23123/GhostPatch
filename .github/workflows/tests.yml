name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the TypeScript demo's own tests pass
        working-directory: examples/buggy-store-ts
        run: node --test

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd examples/buggy-shop
          /tmp/clean/bin/ghostpatch --version
          /tmp/clean/bin/ghostpatch graph stats
          /tmp/clean/bin/ghostpatch doctor --offline --provider ollama
          /tmp/clean/bin/python -c "import importlib.resources as r; w = r.files('ghostpatch') / 'web'; assert all((w / f).is_file() for f in ('index.html', 'app.js', 'app.css', 'graph.js', 'icons.js'))"
