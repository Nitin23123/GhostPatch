# Publishes GhostPatch to PyPI when a GitHub release is published (tag vX.Y.Z).
#
# Uses PyPI trusted publishing, so no API token is stored anywhere. One-time setup on pypi.org:
# Account → Publishing → "Add a new pending publisher" with
#   project: ghostpatch · owner: Nitin23123 · repository: GhostPatch · workflow: publish.yml · environment: pypi
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI verify this workflow instead of using a token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
