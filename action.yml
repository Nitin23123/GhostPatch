name: GhostPatch
description: An AI engineer for your repository. Fixes failing CI, fixes labelled issues, works a night shift and hunts for unreported bugs.
author: Nitin23123
branding:
  icon: check-circle
  color: purple

inputs:
  task:
    description: "What to do: ci-fix (fix failing tests), fix-issue (fix one issue and open a pull request), nightshift (fix every labelled issue and leave a morning report) or haunt (hunt for unreported bugs)."
    default: ci-fix
  provider:
    description: Model provider (groq, openrouter, gemini, ollama or openai). Other free providers whose keys are set become fallbacks.
    default: groq
  model:
    description: Model name (defaults to the provider's default).
    default: ""
  mode:
    description: "ci-fix only. What to do with a verified fix: pr (open a pull request), push (commit to the current branch) or report (only summarise)."
    default: pr
  test-command:
    description: ci-fix only. How to run the tests (detected automatically when empty).
    default: ""
  issue:
    description: fix-issue only. The issue's link, e.g. github.event.issue.html_url.
    default: ""
  label:
    description: nightshift only. Work on open issues with this label.
    default: ghostpatch
  limit:
    description: nightshift only. At most this many issues per night.
    default: "5"
  haunt:
    description: "nightshift: also haunt this many risky functions. haunt: how many to haunt."
    default: "0"
  candidates:
    description: Fix tournament size (1 = a single attempt, 2-5 = several fixes compete).
    default: "1"
  poltergeist:
    description: Rounds of adversarial testing after the fix (0 to turn off).
    default: "1"
  working-directory:
    description: Folder of the project.
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install GhostPatch
      shell: bash
      # Install from the action's own checkout, so `uses: ...@v0.7.0` runs exactly that version.
      run: python -m pip install "${{ github.action_path }}"
    - name: Run GhostPatch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs travel as environment variables, never pasted into the script, so text from an
      # issue can't inject shell commands.
      env:
        GHOSTPATCH_PROVIDER: ${{ inputs.provider }}
        GHOSTPATCH_MODEL: ${{ inputs.model }}
        GP_TASK: ${{ inputs.task }}
        GP_MODE: ${{ inputs.mode }}
        GP_TEST_COMMAND: ${{ inputs.test-command }}
        GP_ISSUE: ${{ inputs.issue }}
        GP_LABEL: ${{ inputs.label }}
        GP_LIMIT: ${{ inputs.limit }}
        GP_HAUNT: ${{ inputs.haunt }}
        GP_CANDIDATES: ${{ inputs.candidates }}
        GP_POLTERGEIST: ${{ inputs.poltergeist }}
      run: |
        # A commit identity for pull requests, when the checkout has none (only inside a git repository).
        if git rev-parse --git-dir > /dev/null 2>&1 && [ -z "$(git config user.email)" ]; then
          git config user.name "GhostPatch"
          git config user.email "ghostpatch@users.noreply.github.com"
        fi
        common=(--approve all --candidates "$GP_CANDIDATES" --poltergeist "$GP_POLTERGEIST")
        case "$GP_TASK" in
          ci-fix)
            args=(ci-fix --mode "$GP_MODE" "${common[@]}")
            if [ -n "$GP_TEST_COMMAND" ]; then args+=(--test-command "$GP_TEST_COMMAND"); fi ;;
          fix-issue)
            if [ -z "$GP_ISSUE" ]; then echo "::error::task fix-issue needs the issue input"; exit 2; fi
            args=(fix "$GP_ISSUE" --pr "${common[@]}") ;;
          nightshift)
            args=(nightshift --label "$GP_LABEL" --limit "$GP_LIMIT" --haunt "$GP_HAUNT" "${common[@]}") ;;
          haunt)
            args=(haunt --targets "$([ "$GP_HAUNT" -gt 0 ] && echo "$GP_HAUNT" || echo 3)" --approve all) ;;
          *)
            echo "::error::Unknown task '$GP_TASK' (use ci-fix, fix-issue, nightshift or haunt)"; exit 2 ;;
        esac
        python -m ghostpatch "${args[@]}"
